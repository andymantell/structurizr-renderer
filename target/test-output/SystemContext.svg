<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1312" height="1712" viewBox="0 0 1312 1712">
<rect width="1312" height="1712" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#707070"><polygon points="0 0, 10 3.5, 0 7"/></marker></defs>\n
<g transform="translate(50,50)">
<g id="element-4">\n<rect x="766" y="1316" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="762" y="1312" width="450" height="300" rx="0" fill="#999999" stroke="#6b6b6b" stroke-width="2"/>\n<text x="987" y="1418" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Software System</text>\n<text x="987" y="1446" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Mainframe Banking System</text>\n<text x="987" y="1478" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Stores all of the core banking</text>\n<text x="987" y="1500" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">information about customers, accounts,</text>\n<text x="987" y="1522" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">transactions, etc.</text>\n</g>\n
<g id="element-5">\n<rect x="16" y="1316" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="12" y="1312" width="450" height="300" rx="0" fill="#999999" stroke="#6b6b6b" stroke-width="2"/>\n<text x="237" y="1432" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Software System</text>\n<text x="237" y="1460" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">E-mail System</text>\n<text x="237" y="1492" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">The internal Microsoft Exchange e-mail</text>\n<text x="237" y="1514" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">system.</text>\n</g>\n
<g id="element-7">\n<rect x="691" y="716" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="687" y="712" width="450" height="300" rx="0" fill="#1168bd" stroke="#0b4884" stroke-width="2"/>\n<text x="912" y="818" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Software System</text>\n<text x="912" y="846" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Internet Banking System</text>\n<text x="912" y="878" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Allows customers to view information</text>\n<text x="912" y="900" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">about their bank accounts, and make</text>\n<text x="912" y="922" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">payments.</text>\n</g>\n
<rect x="-8" y="692" width="1240" height="940" rx="6" fill="none" stroke="#dddddd" stroke-width="2" stroke-dasharray="8,4"/>
<text x="0" y="714" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#dddddd">Big Bank plc</text>
<g id="element-1">\n<circle cx="228.0" cy="100.9" r="88.9" fill="#08427b" stroke="#052e56" stroke-width="2"/>\n<rect x="88.0" y="172.0" width="280.0" height="120.0" fill="#08427b" stroke="#052e56" stroke-width="2"/>\n<line x1="158.0" y1="292.0" x2="108.0" y2="372.0" stroke="#052e56" stroke-width="2"/>\n<line x1="298.0" y1="292.0" x2="348.0" y2="372.0" stroke="#052e56" stroke-width="2"/>\n<line x1="28.0" y1="208.0" x2="88.0" y2="208.0" stroke="#052e56" stroke-width="2"/>\n<line x1="368.0" y1="208.0" x2="428.0" y2="208.0" stroke="#052e56" stroke-width="2"/>\n<text x="228" y="322" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="16" font-style="italic" fill="#ffffff">Person</text>\n<text x="228" y="344" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="22" font-weight="bold" fill="#ffffff">Personal Banking Customer</text>\n<text x="228" y="370" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="16" fill="#ffffff">A customer of the bank, with personal</text>\n<text x="228" y="390" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="16" fill="#ffffff">bank accounts.</text>\n</g>\n

<g>\n<path d="M 428.0 402.1 L 754.2 712.0" fill="none" stroke="#707070" stroke-width="2" stroke-dasharray="8,4"/>\n<path d="M 428.0 402.1 L 754.2 712.0" fill="none" stroke="#707070" stroke-width="2" marker-end="url(#arrow)"/>\n<text x="591.1" y="551.0" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" fill="#707070">Views account balances, and makes payments using</text>\n</g>\n
