<g transform="translate(50,50)">
<g id="element-12">\n<rect x="16" y="616" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="12" y="612" width="450" height="300" rx="0" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/>\n<text x="237" y="732" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#000000">Component: Spring MVC Rest Controller</text>\n<text x="237" y="760" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#000000">Sign In Controller</text>\n<text x="237" y="792" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#000000">Allows users to sign in to the Internet</text>\n<text x="237" y="814" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#000000">Banking System.</text>\n</g>\n
<g id="element-15">\n<rect x="16" y="1216" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="12" y="1212" width="450" height="300" rx="0" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/>\n<text x="237" y="1332" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#000000">Component: Spring Bean</text>\n<text x="237" y="1360" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#000000">Security Component</text>\n<text x="237" y="1392" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#000000">Provides functionality related to</text>\n<text x="237" y="1414" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#000000">signing in, changing passwords, etc.</text>\n</g>\n
<rect x="-8" y="592" width="490" height="940" rx="6" fill="none" stroke="#438dd5" stroke-width="2" stroke-dasharray="8,4"/>
<text x="0" y="614" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#438dd5">API Application</text>
<g id="element-8">\n<rect x="12" y="12" width="450" height="300" rx="6" fill="#438dd5" stroke="#2e6295" stroke-width="2"/>\n<line x1="12" y1="48" x2="462" y2="48" stroke="#2e6295" stroke-width="2"/>\n<rect x="102" y="19" width="270" height="21" rx="10" fill="none" stroke="#2e6295" stroke-width="1"/>\n<text x="237" y="136" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Container: JavaScript and Angular</text>\n<text x="237" y="164" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Single-Page Application</text>\n<text x="237" y="196" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Provides all of the Internet banking</text>\n<text x="237" y="218" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">functionality to customers via their</text>\n<text x="237" y="240" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">web browser.</text>\n</g>\n
<g id="element-18">\n<rect x="12" y="1872" width="450" height="180" fill="#438dd5" stroke="#2e6295" stroke-width="2"/>\n<ellipse cx="237" cy="1872" rx="225" ry="60" fill="#4da2f4" stroke="#2e6295" stroke-width="2"/>\n<path d="M 12 2052 a 225 60 0 0 0 450 0" fill="none" stroke="#2e6295" stroke-width="2"/>\n<text x="237" y="1918" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Container: Oracle Database Schema</text>\n<text x="237" y="1946" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Database</text>\n<text x="237" y="1978" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Stores user registration information,</text>\n<text x="237" y="2000" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">hashed authentication credentials,</text>\n<text x="237" y="2022" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">access logs, etc.</text>\n</g>\n

