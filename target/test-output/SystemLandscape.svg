<g id="element-6">\n<rect x="2316" y="766" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="2312" y="762" width="450" height="300" rx="0" fill="#999999" stroke="#6b6b6b" stroke-width="2"/>\n<text x="2537" y="896" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Software System</text>\n<text x="2537" y="924" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">ATM</text>\n<text x="2537" y="956" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Allows customers to withdraw cash.</text>\n</g>\n
<g id="element-7">\n<rect x="166" y="782" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="162" y="778" width="450" height="300" rx="0" fill="#1168bd" stroke="#0b4884" stroke-width="2"/>\n<text x="387" y="884" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Software System</text>\n<text x="387" y="912" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Internet Banking System</text>\n<text x="387" y="944" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Allows customers to view information</text>\n<text x="387" y="966" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">about their bank accounts, and make</text>\n<text x="387" y="988" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">payments.</text>\n</g>\n
