<g id="element-4">\n<rect x="1546" y="1416" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="1542" y="1412" width="450" height="300" rx="0" fill="#999999" stroke="#6b6b6b" stroke-width="2"/>\n<text x="1767" y="1518" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Software System</text>\n<text x="1767" y="1546" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Mainframe Banking System</text>\n<text x="1767" y="1578" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Stores all of the core banking</text>\n<text x="1767" y="1600" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">information about customers, accounts,</text>\n<text x="1767" y="1622" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">transactions, etc.</text>\n</g>\n
