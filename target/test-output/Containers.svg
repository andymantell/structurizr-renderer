<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#707070"><polygon points="0 0, 10 3.5, 0 7"/></marker></defs>\n
<g transform="translate(50,50)">
<g id="element-1">\n<circle cx="282.0" cy="100.9" r="88.9" fill="#08427b" stroke="#052e56" stroke-width="2"/>\n<rect x="142.0" y="172.0" width="280.0" height="120.0" fill="#08427b" stroke="#052e56" stroke-width="2"/>\n<line x1="212.0" y1="292.0" x2="162.0" y2="372.0" stroke="#052e56" stroke-width="2"/>\n<line x1="352.0" y1="292.0" x2="402.0" y2="372.0" stroke="#052e56" stroke-width="2"/>\n<line x1="82.0" y1="208.0" x2="142.0" y2="208.0" stroke="#052e56" stroke-width="2"/>\n<line x1="422.0" y1="208.0" x2="482.0" y2="208.0" stroke="#052e56" stroke-width="2"/>\n<text x="282" y="322" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="16" font-style="italic" fill="#ffffff">Person</text>\n<text x="282" y="344" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="22" font-weight="bold" fill="#ffffff">Personal Banking Customer</text>\n<text x="282" y="370" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="16" fill="#ffffff">A customer of the bank, with personal</text>\n<text x="282" y="390" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="16" fill="#ffffff">bank accounts.</text>\n</g>\n
<g id="element-4">\n<rect x="1516" y="2516" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="1512" y="2512" width="450" height="300" rx="0" fill="#999999" stroke="#6b6b6b" stroke-width="2"/>\n<text x="1737" y="2618" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Software System</text>\n<text x="1737" y="2646" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Mainframe Banking System</text>\n<text x="1737" y="2678" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Stores all of the core banking</text>\n<text x="1737" y="2700" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">information about customers, accounts,</text>\n<text x="1737" y="2722" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">transactions, etc.</text>\n</g>\n
<g id="element-5">\n<rect x="16" y="2516" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="12" y="2512" width="450" height="300" rx="0" fill="#999999" stroke="#6b6b6b" stroke-width="2"/>\n<text x="237" y="2632" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Software System</text>\n<text x="237" y="2660" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">E-mail System</text>\n<text x="237" y="2692" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">The internal Microsoft Exchange e-mail</text>\n<text x="237" y="2714" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">system.</text>\n</g>\n

<g id="element-10">\n<rect x="1366" y="716" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="1362" y="712" width="450" height="300" rx="0" fill="#438dd5" stroke="#2e6295" stroke-width="2"/>\n<text x="1587" y="818" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Container: Java and Spring MVC</text>\n<text x="1587" y="846" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Web Application</text>\n<text x="1587" y="878" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Delivers the static content and the</text>\n<text x="1587" y="900" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Internet banking single page</text>\n<text x="1587" y="922" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">application.</text>\n</g>\n
<g id="element-11">\n<rect x="766" y="1916" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="762" y="1912" width="450" height="300" rx="0" fill="#438dd5" stroke="#2e6295" stroke-width="2"/>\n<text x="987" y="2032" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Container: Java and Spring MVC</text>\n<text x="987" y="2060" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">API Application</text>\n<text x="987" y="2092" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Provides Internet banking functionality</text>\n<text x="987" y="2114" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">via a JSON/HTTPS API.</text>\n</g>\n
<g id="element-18">\n<rect x="762" y="2572" width="450" height="180" fill="#438dd5" stroke="#2e6295" stroke-width="2"/>\n<ellipse cx="987" cy="2572" rx="225" ry="60" fill="#4da2f4" stroke="#2e6295" stroke-width="2"/>\n<path d="M 762 2752 a 225 60 0 0 0 450 0" fill="none" stroke="#2e6295" stroke-width="2"/>\n<text x="987" y="2618" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Container: Oracle Database Schema</text>\n<text x="987" y="2646" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Database</text>\n<text x="987" y="2678" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Stores user registration information,</text>\n<text x="987" y="2700" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">hashed authentication credentials,</text>\n<text x="987" y="2722" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">access logs, etc.</text>\n</g>\n
<g id="element-8">\n<rect x="1437" y="1312" width="450" height="300" rx="6" fill="#438dd5" stroke="#2e6295" stroke-width="2"/>\n<line x1="1437" y1="1348" x2="1887" y2="1348" stroke="#2e6295" stroke-width="2"/>\n<rect x="1527" y="1319" width="270" height="21" rx="10" fill="none" stroke="#2e6295" stroke-width="1"/>\n<text x="1662" y="1436" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Container: JavaScript and Angular</text>\n<text x="1662" y="1464" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Single-Page Application</text>\n<text x="1662" y="1496" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Provides all of the Internet banking</text>\n<text x="1662" y="1518" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">functionality to customers via their</text>\n<text x="1662" y="1540" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">web browser.</text>\n</g>\n
<g id="element-9">\n<rect x="687" y="1312" width="450" height="300" rx="15" fill="#438dd5" stroke="#2e6295" stroke-width="2"/>\n<rect x="723" y="1348" width="378" height="228" fill="none" stroke="#2e6295" stroke-width="1"/>\n<text x="912" y="1418" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Container: Xamarin</text>\n<text x="912" y="1446" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Mobile App</text>\n<text x="912" y="1478" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Provides a limited subset of the</text>\n<text x="912" y="1500" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Internet banking functionality to</text>\n<text x="912" y="1522" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">customers via their mobile device.</text>\n</g>\n
