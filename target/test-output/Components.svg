<g id="element-14">\n<rect x="841" y="616" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="837" y="612" width="450" height="300" rx="0" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/>\n<text x="1062" y="732" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#000000">Component: Spring MVC Rest Controller</text>\n<text x="1062" y="760" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#000000">Reset Password Controller</text>\n<text x="1062" y="792" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#000000">Allows users to reset their passwords</text>\n<text x="1062" y="814" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#000000">with a single use URL.</text>\n</g>\n
