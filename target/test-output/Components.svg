<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="#707070"><polygon points="0 0, 10 3.5, 0 7"/></marker></defs>\n
<g transform="translate(50,50)">
<g id="element-4">\n<rect x="16" y="1816" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="12" y="1812" width="450" height="300" rx="0" fill="#999999" stroke="#6b6b6b" stroke-width="2"/>\n<text x="237" y="1918" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Software System</text>\n<text x="237" y="1946" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Mainframe Banking System</text>\n<text x="237" y="1978" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Stores all of the core banking</text>\n<text x="237" y="2000" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">information about customers, accounts,</text>\n<text x="237" y="2022" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">transactions, etc.</text>\n</g>\n
<g id="element-5">\n<rect x="766" y="1816" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="762" y="1812" width="450" height="300" rx="0" fill="#999999" stroke="#6b6b6b" stroke-width="2"/>\n<text x="987" y="1932" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Software System</text>\n<text x="987" y="1960" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">E-mail System</text>\n<text x="987" y="1992" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">The internal Microsoft Exchange e-mail</text>\n<text x="987" y="2014" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">system.</text>\n</g>\n
<g id="element-8">\n<rect x="912" y="12" width="450" height="300" rx="6" fill="#438dd5" stroke="#2e6295" stroke-width="2"/>\n<line x1="912" y1="48" x2="1362" y2="48" stroke="#2e6295" stroke-width="2"/>\n<rect x="1002" y="19" width="270" height="21" rx="10" fill="none" stroke="#2e6295" stroke-width="1"/>\n<text x="1137" y="136" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Container: JavaScript and Angular</text>\n<text x="1137" y="164" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Single-Page Application</text>\n<text x="1137" y="196" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Provides all of the Internet banking</text>\n<text x="1137" y="218" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">functionality to customers via their</text>\n<text x="1137" y="240" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">web browser.</text>\n</g>\n
<g id="element-9">\n<rect x="49" y="12" width="450" height="300" rx="15" fill="#438dd5" stroke="#2e6295" stroke-width="2"/>\n<rect x="85" y="48" width="378" height="228" fill="none" stroke="#2e6295" stroke-width="1"/>\n<text x="274" y="118" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Container: Xamarin</text>\n<text x="274" y="146" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Mobile App</text>\n<text x="274" y="178" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Provides a limited subset of the</text>\n<text x="274" y="200" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Internet banking functionality to</text>\n<text x="274" y="222" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">customers via their mobile device.</text>\n</g>\n
<g id="element-18">\n<rect x="1512" y="1872" width="450" height="180" fill="#438dd5" stroke="#2e6295" stroke-width="2"/>\n<ellipse cx="1737" cy="1872" rx="225" ry="60" fill="#4da2f4" stroke="#2e6295" stroke-width="2"/>\n<path d="M 1512 2052 a 225 60 0 0 0 450 0" fill="none" stroke="#2e6295" stroke-width="2"/>\n<text x="1737" y="1918" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#ffffff">Container: Oracle Database Schema</text>\n<text x="1737" y="1946" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#ffffff">Database</text>\n<text x="1737" y="1978" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">Stores user registration information,</text>\n<text x="1737" y="2000" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">hashed authentication credentials,</text>\n<text x="1737" y="2022" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#ffffff">access logs, etc.</text>\n</g>\n

<g id="element-12">\n<rect x="1591" y="616" width="450" height="300" rx="0" fill="#c8c8c8" opacity="0.5"/>\n<rect x="1587" y="612" width="450" height="300" rx="0" fill="#85bbf0" stroke="#5d82a8" stroke-width="2"/>\n<text x="1812" y="732" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" font-style="italic" fill="#000000">Component: Spring MVC Rest Controller</text>\n<text x="1812" y="760" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="24" font-weight="bold" fill="#000000">Sign In Controller</text>\n<text x="1812" y="792" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#000000">Allows users to sign in to the Internet</text>\n<text x="1812" y="814" text-anchor="middle" font-family="Tahoma, Verdana, Helvetica, Arial" font-size="18" fill="#000000">Banking System.</text>\n</g>\n
